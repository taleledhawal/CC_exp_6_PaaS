
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 6 - PaaS</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #172554;
      text-align: center;
    }
    header {
      background: #173b70;
      color: white;
      padding: 24px;
    }
    main {
      max-width: 700px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0001;
    }
    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    footer {
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Experiment 6: PaaS</h1>
    <p>Platform as a Service using AWS Amplify</p>
  </header>

  <main>
    <h2>Welcome!</h2>
    <p>This application is deployed from GitHub using AWS Amplify.</p>
    <p id="status">Deployment project is ready.</p>
    <button onclick="document.getElementById('status').textContent =
      'Application is working successfully!'">
      Test Application
    </button>
  </main>

  <footer>
    Cloud Computing Laboratory | Experiment 6
  </footer>
</body>
</html>
